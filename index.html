<html lang="en">
	<head>

		<meta name="theme-color" content="#0e0d12" />
		<title>Ossuary</title>
		<link rel="icon" href="data:," />
		<!-- Roboto (SIL OFL 1.1, public/fonts/OFL.txt) is self-hosted: variable woff2, weights 400-700 (ADR 0015). -->

		<style>
			@font-face {
				font-family: 'Roboto';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('/fonts/roboto-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
					U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Roboto';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('/fonts/roboto-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,

			}
			@font-face {
				font-family: 'Roboto';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('/fonts/roboto-symbols.woff2') format('woff2');
				unicode-range: U+2190-21FF, U+2212, U+25A0-25FF, U+2600-27BF;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0e0d12;
				overflow: hidden;
			}
			/* The game fills the viewport; Phaser's FIT mode letterboxes inside it (ADR 0015). */
			#game {
				width: 100vw;
				min-height: 100vh;
				height: 100dvh;
			}
			canvas {
				display: block;
			}
		</style>
	</head>

		<div id="game"></div>
